        <article>
            <h3>
                Get in Touch!
            </h3>
            <form>
                <fieldset>
                    <legend>Feel Free to send me a message</legend>
                    <input type="text" placeholder="Full Name">
                    <input type="email" placeholder="Email">
                    <br>
                    <select name="choices">
                        <optgroup label="North America"></optgroup>
                        <option>Canada</option>
                        <option>Mexico</option>
                        <option>United States</option>
                    </select>
                    <input type="tel" placeholder="Phone">
                    <br>
                    <label for="gender">Gender</label>
                    <input type="radio">Male
                    <input type="radio">Female <br>
                    <label for="topic">Topic</label>
                    <input type="checkbox">Skills
                    <input type="checkbox">Interests
                    <input type="checkbox">Chat <br>
                    <label for="message">Message</label><br>
                    <textarea name="paragraphText" rows="10" cols="50"
                        placeholder="Type your message here..."></textarea>
                    <br>
                    <br>
                    <input type="submit">
                </fieldset>
            </form>
        </article>
